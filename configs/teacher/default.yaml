# Teacher Model and Inference Pipeline Configuration
strategy: "single_teacher"
provider: "openrouter"
model_name: "anthropic/claude-3.5-sonnet"
temperature: 0.2
max_tokens: 2048
top_p: 1.0
prompt_version: "v1"
consensus_threshold: 0.8
cost_limit_usd: 50.0
timeout_sec: 30.0

retry:
  max_retries: 3
  initial_backoff: 0.5
  backoff_factor: 2.0

provider_priority:
  - openrouter
  - openai
  - anthropic
  - gemini
  - local
  - ollama
  - vllm
